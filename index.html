<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BERGAMO — Меню</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="phone">

  <header>
    <div class="brand"><span>CAFÉ</span><span class="accent">BERGAMO</span></div>
    <div class="header-right">
      <button class="icon-btn" onclick="openContacts()" aria-label="Контакты">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 10c0 6-9 12-9 12s-9-6-9-12a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
      </button>
      <div class="mark"><img src="images/logo.png" alt="Bergamo"></div>
    </div>
  </header>

  <div class="backbar" id="backbar" onclick="goHome()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
      <path d="M19 12H5M12 19l-7-7 7-7"/>
    </svg>
    <span id="backbar-label">Меню</span>
  </div>

  <!-- Home: category grid + full menu preview -->
  <div id="home">
    <div class="cat-grid" id="cat-grid"></div>
    <div id="preview-sections"></div>
  </div>

  <!-- Category list view -->
  <div id="catview">
    <h1 class="section-title" id="cat-title">—</h1>
    <p class="section-sub" id="cat-sub"></p>
    <div class="item-grid" id="cat-items"></div>
  </div>

  <!-- Item detail view -->
  <div class="detail" id="detail">
    <div class="plate-big" id="detail-emoji"></div>
    <h2 id="detail-name"></h2>
    <div class="price-big" id="detail-price"></div>
    <div class="desc" id="detail-desc"></div>
    <div class="note" id="detail-note" style="display:none;"></div>
    <div class="detail-add" id="detail-add"></div>
  </div>

  <!-- Cart / checkout view -->
  <div class="cartview" id="cartview">
    <h1 class="section-title">Ваш заказ</h1>
    <div id="cart-items"></div>
    <div class="cart-empty" id="cart-empty">Заказ пока пуст — выберите блюда в меню.</div>
    <div class="cart-summary" id="cart-summary" style="display:none;">
      <div class="cart-total-row">
        <span>Итого</span>
        <span id="cart-total">0 р.</span>
      </div>
      <button class="btn-whatsapp" onclick="sendOrderToWhatsApp()">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.48 1.32 5L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.15c-.24.68-1.4 1.32-1.93 1.4-.5.08-1.12.11-1.8-.11-.42-.13-.95-.31-1.64-.6-2.88-1.24-4.76-4.13-4.9-4.32-.14-.19-1.17-1.55-1.17-2.96 0-1.4.74-2.09 1-2.38.27-.28.58-.35.78-.35.2 0 .39 0 .56.01.18.01.42-.07.65.5.24.58.82 2 .89 2.14.07.14.12.31.02.5-.09.19-.14.31-.28.48-.14.17-.29.37-.42.5-.14.14-.28.29-.12.57.16.28.72 1.19 1.55 1.93 1.06.95 1.96 1.24 2.24 1.38.28.14.44.12.61-.07.16-.19.7-.82.89-1.1.19-.28.38-.23.63-.14.26.09 1.63.77 1.91.91.28.14.47.21.53.33.07.12.07.68-.17 1.36z"/></svg>
        Отправить заказ в WhatsApp
      </button>
    </div>
  </div>

  <!-- Contacts & social links -->
  <div class="contactsview" id="contactsview">
    <h1 class="section-title">Контакты</h1>

    <div class="contact-block">
      <div class="contact-row">
        <span class="contact-icon">📍</span>
        <span id="contact-address">—</span>
      </div>
      <div class="contact-row">
        <span class="contact-icon">🕐</span>
        <span id="contact-hours">—</span>
      </div>
      <div class="contact-row">
        <span class="contact-icon">📞</span>
        <a id="contact-phone" href="tel:">—</a>
      </div>
    </div>

    <a id="contact-whatsapp" class="btn-whatsapp contact-wa-btn" href="#" target="_blank" rel="noopener">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.48 1.32 5L2 22l5.25-1.38a9.9 9.9 0 0 0 4.79 1.22h.01c5.46 0 9.9-4.45 9.9-9.91C21.96 6.45 17.5 2 12.04 2zm5.8 14.15c-.24.68-1.4 1.32-1.93 1.4-.5.08-1.12.11-1.8-.11-.42-.13-.95-.31-1.64-.6-2.88-1.24-4.76-4.13-4.9-4.32-.14-.19-1.17-1.55-1.17-2.96 0-1.4.74-2.09 1-2.38.27-.28.58-.35.78-.35.2 0 .39 0 .56.01.18.01.42-.07.65.5.24.58.82 2 .89 2.14.07.14.12.31.02.5-.09.19-.14.31-.28.48-.14.17-.29.37-.42.5-.14.14-.28.29-.12.57.16.28.72 1.19 1.55 1.93 1.06.95 1.96 1.24 2.24 1.38.28.14.44.12.61-.07.16-.19.7-.82.89-1.1.19-.28.38-.23.63-.14.26.09 1.63.77 1.91.91.28.14.47.21.53.33.07.12.07.68-.17 1.36z"/></svg>
      Написать в WhatsApp
    </a>

    <a id="contact-map" class="map-link" href="#" target="_blank" rel="noopener">
      <span class="contact-icon">🗺️</span>
      <span>мы на яндекс карте: <span class="map-link-underline">открыть</span></span>
    </a>

    <h2 class="section-title contact-social-title">Мы в соцсетях</h2>
    <div class="social-grid">
      <a id="contact-instagram" class="social-btn" href="#" target="_blank" rel="noopener">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
        Instagram
      </a>
    </div>
  </div>

  <p class="footer-link">🔒 bergamo.cafe</p>

  <!-- Floating order bar, shown once something is in the cart -->
  <div class="order-bar" id="order-bar" onclick="openCart()">
    <span id="order-bar-count">0 позиций</span>
    <span class="order-bar-right">
      <span id="order-bar-total">0 р.</span>
      <span class="order-bar-cta">Заказать →</span>
    </span>
  </div>

  <!-- Scroll to top, appears after scrolling down -->
  <button class="scroll-top-btn" id="scroll-top-btn" onclick="scrollToTop()" aria-label="Наверх">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
  </button>

</div>

<script src="script.js"></script>
</body>
</html>
